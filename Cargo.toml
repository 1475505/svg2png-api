[package]
name = "svg2png-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
resvg = "0.47"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

# Optimize for smaller binary and faster startup on Render free tier
[profile.release]
strip = true
lto = true
codegen-units = 1
